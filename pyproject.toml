[project]
name = "lcm-websocket-server"
version = "0.9.0-rc.2"
description = "WebSocket server for republishing LCM messages"
authors = [
    {name = "Kevin Barnard", email = "kbarnard@mbari.org"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=16.0",
    "lcmlog-py>=0.1.0",
    "lcm>=1.5.0",
    "lcmutils>=0.1.1",
]

[project.optional-dependencies]
image = [
    "numpy>=1.26.4",
    "opencv-python-headless>=4.9.0.80",
]
orjson = [
    "orjson>=3.10",
]
uvloop = [
    "uvloop>=0.21",
]
# LCM types used by the Docker image and the Dial proxy defaults
lcmtypes = [
    "compas-lcmtypes>=0.4,<0.5",
    "molars-lcmtypes @ https://github.com/CoMPASLab/molars_lcmtypes/releases/download/v0.1.0/molars_lcmtypes-0.1.0-py3-none-any.whl",
]

[project.scripts]
lcm-websocket-server = "lcm_websocket_server.apps.json_proxy:main"
lcm-websocket-json-proxy = "lcm_websocket_server.apps.json_proxy:main"
lcm-websocket-dial-proxy = "lcm_websocket_server.apps.dial_proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# molars-lcmtypes is published as GitHub release assets, not on PyPI
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lcm_websocket_server"]

[dependency-groups]
dev = [
    "compas-lcmtypes>=0.4,<0.5",
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.17,<0.18",
]
release = [
    "python-semantic-release>=10.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
# lcm-gen output is not edited by hand
extend-exclude = [
    "lcm_websocket_server/lib/lcm_utils/channel_stats.py",
    "lcm_websocket_server/lib/lcm_utils/channel_stats_list.py",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
allow_zero_version = true
major_on_zero = false
# Keep uv.lock in sync with the bumped version and build the release assets
build_command = """
    uv lock --upgrade-package lcm-websocket-server
    git add uv.lock
    uv build
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
